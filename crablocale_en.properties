usage=Usage: java -D<x>=<y> -jar crab.jar <keywords in double quotes>
wherex=where x: 
repeat=repeat -- genereate abbreviaton N times
exclude=exclude -- if set to true, then exclude some words (boolean)
nodict=nodict -- if set to true, then ignore dictionary (boolean)
