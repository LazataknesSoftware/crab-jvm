short=short -- if set to true, then maximally shorten words (boolean)
noprefix=noprefix -- if set to true, then remove (English) prepositions: when, what, why, at, the, of, in etc. (boolean)
booleanusage=Boolean parameters are true/false
errornodict=Error: dictionary (dict.txt) not found
hintnodict=Try -Dnodict=true to bypass this error.