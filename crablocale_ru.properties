usage=Использование: java -D<x>=<y> -jar crab.jar <ключевые слова в кавычках>
wherex=где x: 
repeat=repeat -- сгенерировать аббревиатуру n раз
exclude=exclude -- если true, то исключить некоторые слова (логический)
nodict=nodict -- если true, то игнорировать словарь (логический)
shuffle=shuffle -- если true, то перемешать слова (логический)
short=short -- если true, то максимально сократить слова (логический)
noprefix=noprefix -- если true, то убрать (английские) предлоги: when, what, why, at и т.д. (логический)
booleanusage=Логические параметры принимают true/false
errornodict=Ошибка: нет словаря (dict.txt)
hintnodict=Попробуйте -Dnodict=true, чтобы обойти эту ошибку